<title>Suivi PPL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Concept: carnet de salle. En-tête collant avec la date, trois onglets en bas (Aujourd'hui, Séance, Progrès), cartes sobres, chiffres condensés pour les charges. */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface2:#F4F7F5; --ink:#121C18; --muted:#566660; --line:#D9E1DD;
  --accent:#1F5FD1; --accent-ink:#FFFFFF; --accent-soft:#E2EBFA; --good:#1B8553; --warn:#B3640A; --bad:#C23B3B;
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1412; --surface:#161F1B; --surface2:#1C2722; --ink:#E7EFEB; --muted:#93A49C; --line:#2A3832;
    --accent:#6F9BFF; --accent-ink:#0B1220; --accent-soft:#1B2A4A; --good:#4CC38A; --warn:#E0A04A; --bad:#EF7B7B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1B; --surface2:#1C2722; --ink:#E7EFEB; --muted:#93A49C; --line:#2A3832;
  --accent:#6F9BFF; --accent-ink:#0B1220; --accent-soft:#1B2A4A; --good:#4CC38A; --warn:#E0A04A; --bad:#EF7B7B;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:640px;margin:0 auto}

/* en-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px}
.brand{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.save{letter-spacing:.02em;text-transform:none;font-weight:500}
.nav{display:flex;align-items:center;gap:8px;margin-top:4px}
.ttl{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1;text-wrap:balance;text-align:center}
.ib{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.pill{font-family:var(--f-body);font-size:12px;font-weight:600;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:3px 10px}

/* semaine */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:10px 0 4px}
.wd{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.wd small{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em}
.wd b{font-family:var(--f-display);font-size:19px;line-height:1}
.wd.sel{border-color:var(--accent);background:var(--accent-soft)}
.dots{display:flex;gap:4px;height:7px}
.dot{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--line);background:transparent}
.dot.s.on{background:var(--accent);border-color:var(--accent)}
.dot.p.on{background:var(--good);border-color:var(--good)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:2px 2px 0}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:baseline}

/* cartes */
.stack{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:.01em}
.card h2 small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted);margin-left:8px;letter-spacing:0}
.hint{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;color:var(--muted);font-weight:600}
.in{width:100%;min-width:0;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink)}
.in::placeholder{color:var(--muted);opacity:.7}
.in:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea.in{resize:vertical;min-height:70px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}

/* barres */
.big{display:flex;align-items:baseline;gap:8px}
.big b{font-family:var(--f-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.big span{color:var(--muted);font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.good i{background:var(--good)}
.bar.warn i{background:var(--warn)}
.meter{display:flex;flex-direction:column;gap:6px}
.meter .lab{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-variant-numeric:tabular-nums}
.meter .lab span:first-child{font-weight:600}

/* repas */
.meals{display:flex;flex-direction:column}
.meal{display:grid;grid-template-columns:minmax(0,1fr) auto auto 36px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.meal:first-child{border-top:0}
.meal .nm{overflow-wrap:anywhere}
.meal .m{color:var(--muted);font-size:14px}
.x{width:36px;height:36px;border-radius:8px;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1}
.addm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.addm .full{grid-column:1/-1}

/* séance */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1 1 30%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 8px;text-align:center;font-weight:600;line-height:1.2}
.chip small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.exo{display:flex;flex-direction:column;gap:10px}
.exo-h{display:flex;gap:8px;align-items:center}
.exo-name{font-family:var(--f-display);font-weight:700;font-size:20px;padding:6px 8px;background:transparent;border-color:transparent;flex:1;min-width:0}
.exo-name:focus{background:var(--surface2);border-color:var(--line)}
.tgt{font-size:13px;color:var(--muted)}
.last{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sugg{font-size:13px;color:var(--good);font-weight:600}
.shead,.srow{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 44px;gap:8px;align-items:center}
.shead{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.sn{font-family:var(--f-display);font-size:18px;font-weight:700;color:var(--muted);text-align:center}
.ok{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.ok.on{background:var(--good);border-color:var(--good);color:#fff}
.srow .in{text-align:center;font-variant-numeric:tabular-nums;font-weight:500}
.srow.done .in{border-color:var(--good)}
.sbtns{display:flex;gap:8px;flex-wrap:wrap}
.sum{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.sum b{font-family:var(--f-display);font-size:22px}

/* progrès */
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;font-variant-numeric:tabular-nums}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){font-weight:600;text-align:right}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .tx{fill:var(--muted);font:11px var(--f-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .gd{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.chart .ln{stroke:var(--accent);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--accent)}
.chart .bar-r{fill:var(--accent)}
.chart .bar-r.hit{fill:var(--good)}
.chart .bar-r.zero{fill:var(--line)}
select.in{appearance:auto}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.hist b{color:var(--ink);font-weight:600}
.empty{font-size:14px;color:var(--muted);padding:6px 0}
details summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
.notice{font-size:13px;color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:8px 12px}

/* barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tab{border:0;background:transparent;border-radius:10px;min-height:46px;font-weight:600;color:var(--muted);font-size:15px}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s ease}}
@media (max-width:380px){.ttl{font-size:23px}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

<div class="app" id="app"></div>

<script>
(function(){
'use strict';

/* ---------- données du plan ---------- */
var TEMPLATES={
  A:{name:'Pecs + biceps',exos:[['Développé incliné',4,6,10],['Développé couché ou pec deck',3,8,12],['Écarté à la poulie',3,10,15],['Curl incliné haltères',3,8,12],['Curl marteau',3,10,15],['Curl barre EZ ou poulie',2,10,15]]},
  B:{name:'Dos + triceps',exos:[['Traction',4,6,10],['Rowing T-bar',3,8,12],['Tirage horizontal',3,8,12],['Tirage vertical',3,8,12],['Face pull',3,12,15],['Dips',3,6,10],['Extension triceps au-dessus de la tête',3,10,15],['Pushdown poulie',2,10,15]]},
  C:{name:'Jambes + épaules',exos:[['Élévations latérales',4,12,20],['Développé épaules',3,8,12],['Squat ou presse à cuisses',4,6,10],['Soulevé de terre roumain',3,8,12],['Leg extension',3,12,15],['Leg curl',3,10,15],['Mollets debout',4,10,15],['Crunch à la poulie',3,10,15]]}
};
var PLAN={1:'A',2:'B',3:'C',4:null,5:'A',6:'B',0:'C'};
var INITIALS=['L','M','M','J','V','S','D'];

/* ---------- outils ---------- */
function pad(n){return String(n).padStart(2,'0')}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dateOf(k){var p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(k,n){var d=dateOf(k);d.setDate(d.getDate()+n);return keyOf(d)}
function num(v){if(v===null||v===undefined||v==='')return null;var x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:null}
function fmt(n,dec){if(n===null||n===undefined||!isFinite(n))return '';return Number(n).toLocaleString('fr-CH',{maximumFractionDigits:dec===undefined?1:dec})}
function raw(n){return n===null||n===undefined?'':String(n).replace('.',',')}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function norm(s){return String(s||'').trim().toLowerCase()}
function pct(a,b){return b>0?Math.max(0,Math.min(100,Math.round(a/b*100))):0}
function short(k){var d=dateOf(k);return d.toLocaleDateString('fr-CH',{day:'numeric',month:'short'})}
function weekKeys(k){var dow=(dateOf(k).getDay()+6)%7;var s=addDays(k,-dow);var out=[];for(var i=0;i<7;i++)out.push(addDays(s,i));return out}

function h(tag,props){
  var e=document.createElement(tag),val;
  if(props){for(var k in props){var v=props[k];if(v===null||v===undefined||v===false)continue;
    if(k==='class')e.className=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(k==='value')val=v;
    else e.setAttribute(k,v===true?'':v);}}
  var kids=[].slice.call(arguments,2);
  (function add(list){list.forEach(function(c){
    if(c===null||c===undefined||c===false)return;
    if(Array.isArray(c))return add(c);
    e.append(c.nodeType?c:document.createTextNode(String(c)));});})(kids);
  if(val!==undefined)e.value=val;
  return e;
}
var NS='http://www.w3.org/2000/svg';
function s(tag,attrs){var e=document.createElementNS(NS,tag);for(var k in attrs||{})e.setAttribute(k,attrs[k]);for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c===null||c===undefined)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}
function icon(d,size){return s('svg',{viewBox:'0 0 24 24',width:size||20,height:size||20,fill:'none',stroke:'currentColor','stroke-width':'2.4','stroke-linecap':'round','stroke-linejoin':'round','aria-hidden':'true'},s('path',{d:d}))}

/* ---------- état ---------- */
var S={days:{},cfg:{kcal:2300,prot:160,steps:10000},date:keyOf(new Date()),tab:'today',mode:'pending',uid:null,db:null,
  pendingType:null,exoPick:null,saveMsg:'',touched:{}};

function newDay(k){return {date:k,steps:null,meals:[],walk:{min:null,incline:null,speed:null,bpm:null},weight:null,waist:null,sleep:null,note:'',session:null}}
function mergeDay(k,data){var d=newDay(k);var src=JSON.parse(JSON.stringify(data||{}));for(var f in src){if(f==='walk')Object.assign(d.walk,src.walk);else d[f]=src[f]}return d}
function getDay(k){return S.days[k]||(S.days[k]=newDay(k))}
function mealTotals(d){var k=0,p=0;(d.meals||[]).forEach(function(m){k+=m.k||0;p+=m.p||0});return {k:k,p:p}}
function sessionDone(d){return !!(d&&d.session&&d.session.exos.some(function(e){return e.sets.some(function(x){return x.ok})}))}
function stepsHit(d){return !!(d&&d.steps!==null&&d.steps>=S.cfg.steps)}
function sessionStats(d){var done=0,total=0,vol=0;if(d.session)d.session.exos.forEach(function(e){e.sets.forEach(function(x){total++;if(x.ok){done++;vol+=(x.kg||0)*(x.reps||0)}})});return {done:done,total:total,vol:vol}}

/* ---------- sauvegarde ---------- */
var LS='suivi-ppl-v1';
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({days:S.days,cfg:S.cfg}));return true}catch(e){return false}}
function loadLocal(){try{var r=localStorage.getItem(LS);if(!r)return;var o=JSON.parse(r);Object.keys(o.days||{}).forEach(function(k){if(!S.touched[k])S.days[k]=mergeDay(k,o.days[k])});if(o.cfg&&!S.touched.cfg)Object.assign(S.cfg,o.cfg)}catch(e){}}
function ref(key){return S.db.collection('data/users/'+S.uid).doc(key==='cfg'?'cfg':'d-'+key)}
var timers={},chains={};
function paintSave(){var el=document.getElementById('save');if(el)el.textContent=S.saveMsg}
function touch(key){
  S.touched[key]=true;S.saveMsg='Enregistrement…';paintSave();
  clearTimeout(timers[key]);
  timers[key]=setTimeout(function(){chains[key]=(chains[key]||Promise.resolve()).then(function(){return write(key)})},500);
}
function write(key){
  if(S.mode==='pending')return Promise.resolve();
  var p;
  if(S.mode==='db'){
    var data=key==='cfg'?S.cfg:S.days[key];
    p=ref(key).set(JSON.parse(JSON.stringify(data)));
  }else{p=saveLocal()?Promise.resolve():Promise.reject(new Error('local'))}
  return p.then(function(){S.saveMsg='Enregistré';paintSave()},function(){S.saveMsg='Échec de l’enregistrement';paintSave()});
}

/* ---------- rendu général ---------- */
function setDate(k){S.date=k;S.pendingType=null;render(false);window.scrollTo(0,0)}
function render(keep){
  var y=window.scrollY;
  var app=document.getElementById('app');
  app.replaceChildren(header(),h('main',null,S.tab==='today'?viewToday():S.tab==='session'?viewSession():viewProgress()),tabbar(),h('datalist',{id:'exo-names'},knownExos().map(function(n){return h('option',{value:n})})));
  if(keep!==false)window.scrollTo(0,y);
}
function header(){
  var d=dateOf(S.date),today=S.date===keyOf(new Date());
  var title=cap(d.toLocaleDateString('fr-CH',{weekday:'long',day:'numeric',month:'long'}));
  return h('header',{class:'top'},
    h('div',{class:'brand'},h('span',null,'Suivi PPL'),h('span',{id:'save',class:'save','aria-live':'polite'},S.saveMsg)),
    h('div',{class:'nav'},
      h('button',{class:'ib',type:'button','aria-label':'Jour précédent',onclick:function(){setDate(addDays(S.date,-1))}},icon('M15 5l-7 7 7 7')),
      h('div',{class:'ttl'},h('span',null,title),!today&&h('button',{class:'pill',type:'button',onclick:function(){setDate(keyOf(new Date()))}},'Aujourd’hui')),
      h('button',{class:'ib',type:'button','aria-label':'Jour suivant',onclick:function(){setDate(addDays(S.date,1))}},icon('M9 5l7 7-7 7'))));
}
function tabbar(){
  function t(id,label){return h('button',{class:'tab',type:'button','aria-current':S.tab===id?'page':null,onclick:function(){S.tab=id;render(false);window.scrollTo(0,0)}},label)}
  return h('nav',{class:'tabs','aria-label':'Sections'},h('div',{class:'tabs-in'},t('today','Aujourd’hui'),t('session','Séance'),t('progress','Progrès')));
}
function weekStrip(){
  var keys=weekKeys(S.date);
  return keys.map(function(k,i){
    var d=S.days[k];
    return h('button',{class:'wd'+(k===S.date?' sel':''),type:'button','aria-label':cap(dateOf(k).toLocaleDateString('fr-CH',{weekday:'long',day:'numeric',month:'long'})),onclick:function(){setDate(k)}},
      h('small',null,INITIALS[i]),h('b',null,String(dateOf(k).getDate())),
      h('div',{class:'dots'},h('i',{class:'dot s'+(sessionDone(d)?' on':'')}),h('i',{class:'dot p'+(stepsHit(d)?' on':'')})));
  });
}
function weekBlock(){
  return [h('div',{class:'week',id:'week'},weekStrip()),
    h('div',{class:'legend'},h('span',null,h('i',{style:'background:var(--accent)'}),'Séance faite'),h('span',null,h('i',{style:'background:var(--good)'}),'Objectif de pas atteint'))];
}
function paintWeek(){var w=document.getElementById('week');if(w)w.replaceChildren.apply(w,weekStrip())}
function modeNotice(){
  if(S.mode==='pending')return h('p',{class:'hint'},'Chargement de tes données…');
  if(S.mode==='local')return h('p',{class:'notice'},'Sauvegarde sur cet appareil uniquement. Si tu vides les données du navigateur, tout est perdu.');
  return null;
}

/* ---------- champs ---------- */
function numInput(obj,prop,o){
  var inp=h('input',{class:'in',type:'text',inputmode:o.dec===0?'numeric':'decimal',autocomplete:'off',placeholder:o.ph||'',id:o.id,'aria-label':o.label,
    value:raw(obj[prop]),
    oninput:function(){obj[prop]=num(inp.value);touch(o.key||S.date);if(o.after)o.after();updateDerived()}});
  return inp;
}
function labeled(text,input){return h('label',{class:'fld'},h('span',null,text),input)}
function meter(label,valueText,p,cls,barId,txtId){
  return h('div',{class:'meter'},h('div',{class:'lab'},h('span',null,label),h('span',{id:txtId},valueText)),h('div',{class:'bar '+(cls||'')},h('i',{id:barId,style:'width:'+p+'%'})));
}
function updateDerived(){
  var d=getDay(S.date);
  var f=document.getElementById('steps-fill'),t=document.getElementById('steps-txt');
  if(f){var p=pct(d.steps||0,S.cfg.steps);f.style.width=p+'%';f.parentNode.className='bar'+(stepsHit(d)?' good':'')}
  if(t)t.textContent=fmt(d.steps||0,0)+' / '+fmt(S.cfg.steps,0);
  paintWeek();paintSessionCount();
}
function paintSessionCount(){

function lastFor(name,before){

  for(var i=0;i<keys.length;i++){
    var k=keys[i];if(k>=before)continue;
    var se=S.days[k].session;if(!se)continue;
    for(var j=0;j<se.exos.length;j++){
      var e=se.exos[j];
      if(norm(e.n)===nm){

/* ---------- onglet Progrès ---------- */
function lineChart(pts,unit){
  var W=340,H=170,L=38,R=10,T=12,B=26;
  var ys=pts.map(function(p){return p.y}),min=Math.min.apply(null,ys),max=Math.max.apply(null,ys);
  if(min===max){min-=1;max+=1}
  var padY=(max-min)*0.15;min-=padY;max+=padY;
  var t0=pts[0].t,t1=pts[pts.length-1].t;
  function X(t){return pts.length===1||t1===t0?(L+(W-L-R)/2):L+(t-t0)/(t1-t0)*(W-L-R)}
  function Y(v){return T+(1-(v-min)/(max-min))*(H-T-B)}
  var svg=s('svg',{class:'chart',viewBox:'0 0 '+W+' '+H,role:'img','aria-label':'Courbe '+unit});
  [min,(min+max)/2,max].forEach(function(v){
    svg.append(s('line',{class:'gl',x1:L,x2:W-R,y1:Y(v),y2:Y(v)}));
    svg.append(s('text',{class:'tx',x:L-6,y:Y(v)+4,'text-anchor':'end'},fmt(v,1)));
  });
  var dd=pts.map(function(p,i){return (i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.y).toFixed(1)}).join(' ');
  if(pts.length>1)svg.append(s('path',{class:'ln',d:dd}));
  pts.forEach(function(p,i){svg.append(s('circle',{class:'pt',cx:X(p.t),cy:Y(p.y),r:i===pts.length-1?4.5:2.8}))});
  svg.append(s('text',{class:'tx',x:L,y:H-6,'text-anchor':'start'},short(pts[0].k)));
  if(pts.length>1)svg.append(s('text',{class:'tx',x:W-R,y:H-6,'text-anchor':'end'},short(pts[pts.length-1].k)));
  return svg;
}
function barChart(keys,vals,goal){
  var W=340,H=150,L=6,R=34,T=10,B=22,n=vals.length;
  var max=Math.max(goal*1.1,Math.max.apply(null,vals)*1.05,1);
  var bw=(W-L-R)/n;
  var svg=s('svg',{class:'chart',viewBox:'0 0 '+W+' '+H,role:'img','aria-label':'Pas des 14 derniers jours'});
  function Y(v){return T+(1-v/max)*(H-T-B)}
  svg.append(s('line',{class:'gd',x1:L,x2:W-R,y1:Y(goal),y2:Y(goal)}));
  svg.append(s('text',{class:'tx',x:W-R+4,y:Y(goal)+4,'text-anchor':'start'},fmt(goal/1000,1)+'k'));
  vals.forEach(function(v,i){
    var x=L+i*bw+2,hh=Math.max(0,Y(0)-Y(v));
    svg.append(s('rect',{class:'bar-r'+(v>=goal?' hit':v===0?' zero':''),x:x,y:v===0?Y(0)-2:Y(v),width:Math.max(2,bw-4),height:v===0?2:hh,rx:2}));
    var dow=(dateOf(keys[i]).getDay()+6)%7;
    svg.append(s('text',{class:'tx','font-size':'10',x:x+(bw-4)/2,y:H-6,'text-anchor':'middle'},INITIALS[dow]));
  });
  return svg;
}

      h('div',{class:'hist'},ser.slice(-5).reverse().map(function(p){return h('div',null,h('b',null,short(p.k)),' : '+p.sets.map(function(x){return (x.kg!==null?fmt(x.kg):'0')+' × '+x.reps}).join(', '))})));
  }
  return h('div',null,weekBlock(),h('div',{class:'stack'},modeNotice(),weekCard,weightCard,stepsCard,exoCardEl));
}

/* ---------- démarrage ---------- */
function withTimeout(p,ms){return new Promise(function(res){var done=false;var t=setTimeout(function(){if(!done){done=true;res(null)}},ms);Promise.resolve(p).then(function(v){if(!done){done=true;clearTimeout(t);res(v)}},function(){if(!done){done=true;clearTimeout(t);res(null)}})})}
function init(){
  render(false);
  var c=window.claude;
  var go=function(){
    if(c&&c.use){
      return withTimeout(Promise.all([c.use('db'),c.use('user')]),8000).then(function(r){
        var db=r&&r[0],user=r&&r[1];
        if(!db||!user)return null;
        return Promise.resolve(user.id()).then(function(id){return id?{db:db,id:id}:null});
      });
    }
    return Promise.resolve(null);
  };
  go().then(function(env){
    if(!env){S.mode='local';loadLocal();return}
    S.db=env.db;S.uid=env.id;
    return env.db.collection('data/users/'+env.id).get().then(function(snap){
      snap.docs.forEach(function(doc){
        if(doc.id==='cfg'){if(!S.touched.cfg)Object.assign(S.cfg,JSON.parse(JSON.stringify(doc.data()||{})))}
        else if(doc.id.indexOf('d-')===0){var k=doc.id.slice(2);if(!S.touched[k])S.days[k]=mergeDay(k,doc.data())}
      });
      S.mode='db';
    },function(){S.mode='local';loadLocal()});
  }).catch(function(){S.mode='local';loadLocal()}).then(function(){
    Object.keys(S.touched).forEach(function(k){touch(k)});
    render();
  });
}
init();
})();
</script>
